trigger: none

pool:
  name: Ammupool   # self-hosted agenst

steps:
- task: TerraformInstaller@1
  displayName: terraform installer
  inputs:
    terraformVersion: 'latest'

- task: TerraformTask@5
  displayName: terraform init
  inputs:
    provider: 'azurerm'
    command: 'init'
    workingDirectory: $(System.DefaultWorkingDirectory)Environment/Dev
    backendServiceArm: 'Maddypipeline'
    backendAzureRmStorageAccountName: 'shipoostg'
    backendAzureRmContainerName: 'shipoocont'
    backendAzureRmKey: 'terraform.tfstate'

- task: tfsec@1
  displayName: terra sec 
  inputs:
    version: 'v1.26.0'
    dir: '$(System.DefaultWorkingDirectory)Environment/Dev'
































